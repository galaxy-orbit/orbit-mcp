name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      # The generated API surface is committed: fail when it no longer matches the installed packages.
      - run: node scripts/generate-api-surface.mjs --check
      - run: bun run typecheck
      - run: bun test src
      - run: node scripts/smoke.mjs
