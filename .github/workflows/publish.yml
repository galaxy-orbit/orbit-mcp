name: Publish
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11.x — required for OIDC trusted publishing
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: bun install
      - run: bun run build
      - run: bun run build:types
      # A failure here used to be swallowed by `|| echo`, which silently turned a broken
      # release into a green run that published nothing. Fail loudly and print the result.
      - name: Version the packages from the pending changesets
        run: |
          bunx changeset version
          node -p "'version after changeset version: ' + require('./package.json').version"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The version bump and the consumed changesets used to stay in the runner, so the repo kept
      # the previous version and the changeset it had just spent: the next push bumped the same
      # number again (0.2.0 -> 0.3.0 -> 0.4.0 in a single day) and a publish could collide with a
      # version npm already served. Commit the release back first; a push made with GITHUB_TOKEN
      # does not start another workflow run, so this cannot loop.
      - name: Commit the release back to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): version packages" || echo "nothing to commit"
          git push
      # Trusted publishing: authenticated via OIDC claims — no NPM_TOKEN needed
      - name: Publish to npm
        run: bunx changeset publish
        env:
          NPM_CONFIG_PROVENANCE: true
